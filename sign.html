<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login page</title>
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <header>BuildEasy</header>
    <main>
      <div class="container">
        <h2>Login</h2>
        <form>
          <div class="input-grp">
            <input
              type="text"
              name="email"
              placeholder="Email"
              autocomplete="email"
              required
            />
            <input
              type="password"
              name="password"
              placeholder="Password"
              autocomplete="current-password"
              required
            />
          </div>
          <button type="submit">Login</button>

          <div class="outer-links">
            <a href="forget.html">Forget Password?</a> |
            <a href="sign.html">Sign Up</a>
          </div>
        </form>
      </div>
    </main>
    <footer>© 2025 Home Services Platform. All rights reserved.</footer>
  </body>
</html>
